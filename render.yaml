services:
  # Backend API (Express + Prisma + Socket.io)
  - type: web
    name: zoom-rms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://zoom-rms.vercel.app
      - key: BAKONG_ACCOUNT_ID
        value: abaakhppxxx@abaa
      - key: KHQR_BAKONG_ID_USD
        value: "500536911"
      - key: KHQR_BAKONG_ID_KHR
        value: "600579964"
      - key: KHQR_MERCHANT_NAME
        value: NEANG NEN
      - key: KHQR_MERCHANT_CITY
        value: Phnom Penh
      - key: KHQR_ABA_P2P_TAG
        value: 40600006abaP2P011237977D9FDA2D020960057996403095005369110404Dual
      - key: BAKONG_TOKEN
        sync: false

  # Frontend Single Page App (React + Vite)
  - type: static
    name: zoom-rms-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zoom-rms-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://zoom-rms-backend.onrender.com

