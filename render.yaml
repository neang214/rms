services:
  # Backend API (Express + Prisma + Socket.io)
  - type: web
    name: zoom-rms-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/orders
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: KHQR_BAKONG_ID_USD
        sync: false
      - key: KHQR_BAKONG_ID_KHR
        sync: false
      - key: KHQR_MERCHANT_NAME
        value: NEN NEANG
      - key: KHQR_MERCHANT_CITY
        value: Phnom Penh
      - key: BAKONG_TOKEN
        sync: false

  # Frontend Single Page App (React + Vite)
  - type: static
    name: zoom-rms-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

